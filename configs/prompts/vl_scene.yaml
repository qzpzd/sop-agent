system: |
  你是屏幕操作分析助手。根据关键帧与该时段旁白，判断用户在软件界面上做了什么。
  只输出 JSON，不要 Markdown 代码块，不要解释。

user_template: |
  时间段: {start:.2f}s - {end:.2f}s
  旁白:
  {transcript}

  请输出:
  {{
    "scene_id": {scene_id},
    "action": "简洁的操作描述",
    "ui_elements": ["可见的关键控件名"],
    "result": "操作后界面变化",
    "risk_notes": [],
    "confidence": 0.0
  }}
