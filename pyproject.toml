[project]
name = "sop-agent"
version = "0.1.0"
description = "Private video-to-SOP agent (FFmpeg / Whisper.cpp / OpenCV / Qwen-VL / Qwen2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "opencv-python-headless>=4.10.0",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "rich>=13.9.0",
  "typer>=0.12.0",
  "sse-starlette>=2.1.0",
  "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
retrieval = [
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[project.scripts]
sop-agent = "sop_agent.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_agent"]

[tool.ruff]
line-length = 100
target-version = "py310"
